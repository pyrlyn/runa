# Configuration for pyrlyn/ci's ci.yml, called from pipeline.yml (docs/config.md in pyrlyn/ci).
# The repository is being rewritten in Kotlin/Native (PLAN.md). Until the Gradle build lands
# (phase 0), only workflow and license checks run; CodeQL for Kotlin and SonarCloud are switched
# back on in phase 0 once there is code to analyse.
version: 1

docs-only:
  enabled: true

codeql:
  languages: [actions]

sonarcloud:
  enabled: false

# License files against pyrlyn/ci's canonical ones.
license:
  enabled: true
