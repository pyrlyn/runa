# The only way to a release, and the only thing that creates a `v*` tag (pyrlyn/ci bump.yml).
# `scripts/release.sh <level> --local` makes one `release: vX.Y.Z` commit (the version in
# gradle.properties); bump pushes it to `release/bump-vX.Y.Z` and opens a pull request into main
# with RELEASE_PLZ_TOKEN, so the pull request's own CI reports the required checks. Once they are
# green, bump rebase-merges it, tags the commit that landed on main, creates a draft release with
# GitHub's generated notes and dispatches release.yml on the tag, which fills the draft and
# publishes it. Red checks, a timeout or a failed merge close the pull request: no tag, no
# release. `dry-run` stops after the checks. The local preview: `scripts/release.sh <level> --dry-run`.
# Inputs and permissions: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: open the version pull request and wait for its checks, then close it
        default: false
        type: boolean
      release-untagged-head:
        description: release the untagged version already on main (nothing to commit) as it stands
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/ci/.github/workflows/bump.yml@9675ff42a0e3785beabccb68b0e4fa65910de453 # main
    permissions:
      contents: write # the bump branch, the tag and the release
      pull-requests: write # merge or close the bump pull request
      actions: write # dispatch release.yml
      checks: read # wait for the required checks
      statuses: read
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      level: ${{ inputs.level }}
      dry-run: ${{ inputs.dry-run }}
      release-untagged-head: ${{ inputs.release-untagged-head }}
      # A release is a regular one; a version with a `-` suffix is a prerelease either way.
      prerelease: false
      # scripts/release.sh needs bash, sed and git only.
      mise: false
    secrets:
      BUMP_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
