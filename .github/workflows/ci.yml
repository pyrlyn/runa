# CI matrix: macos-14 (arm64, metal), ubuntu-22.04 (x86_64; CPU tests, CUDA build-only), windows-2022 (build-only).
# Task P0.2 — `cargo clippy -D warnings`, `cargo fmt --check` must be green on all three.
# Source of truth for toolchain: rust-toolchain.toml (channel 1.98). The `dtolnay/rust-toolchain`
# action respects that file; we also request clippy + rustfmt components.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# P14.1: CI runs on push/merge to main and on ready (non-draft) PRs to main.
# Draft PRs are skipped; `review` runs only via the `/review` comment workflow.
# Releases go through `bump.yml` (Actions -> Bump and release: a version PR this CI gates).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} (${{ matrix.target }})
    # Skip draft PRs (push/workflow_dispatch have no pull_request object).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            # Metal is available on macos-14 runners; CUDA not needed.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # ubuntu job does CPU tests; CUDA is build-only (gated behind features, not required here).
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            # Windows is build-only per P0.2.

    # P11.8: CI-only cargo profile tuning (local builds unaffected).
    # `debug = 0` drops debuginfo emission: faster links and much smaller
    # target/ artifacts, which dominate warm runs through rust-cache
    # restore/save (~2.5 min on ubuntu/macos). Test semantics are unchanged;
    # failure backtraces keep symbols but lose line numbers.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install tools via mise (K2, D21)
        uses: jdx/mise-action@v2
        with:
          install: true
          # also installs rust 1.98, moon 2.5.4, ffmpeg 9.0.1, python 3.13.15, node 24.21.0, cargo-dist 0.33.0 (aqua), cargo-cache 0.8.3
          # rust-toolchain.toml stays the rustup source of truth; mise mirrors the pin

      - uses: Swatinem/rust-cache@v2
        with:
          # v1: drop caches with whisper's ggml built GGML_NATIVE=ON (SIGILL)
          prefix-key: v1-rust
          shared-key: ci-${{ matrix.target }}

      - name: sccache cold-build insurance (P12.2)
        # Measured verdict: cold Swatinem + warm sccache compiles in
        # ~2.5 min (clippy 1m34s + build 30s + test 24s, 88.5% hit
        # rate) vs ~8.5+ min true-cold on ubuntu (run 35099674405 vs
        # worker-B baselines). Swatinem stays the warm fast path;
        # sccache (small GHA blobs, content-keyed) covers cache busts.
        # Overhead on warm runs: ~1 s server start + stats.
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: enable sccache wrappers (P12.2)
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - name: Show toolchain (mise + rustup)
        # Multi-line script: force bash (Windows default is PowerShell).
        shell: bash
        run: |
          mise ls
          mise doctor || true
          rustc --version
          cargo --version
          rustup show
          moon --version || true
          ffmpeg -version | head -1 || true
          python3 --version || true
          node --version || true
          dist --version

      - name: dist generate --check (P6.3)
        # P12.1: ubuntu-only. The check validates the generated workflow
        # against dist-workspace.toml, which is platform-independent (the
        # matrix it emits already covers all OSes), so one run proves it.
        # Trade-off: loses per-OS proof that `dist` itself behaves here.
        if: runner.os == 'Linux'
        run: dist generate --mode=ci --check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace (CPU tests)
        # P0.2 says ubuntu does CPU tests; other OS also run tests. We test
        # only libs (`--lib`) so the P0.4 `runa-engine` examples (which need
        # `llama-cpp-2`/`encoding_rs` wiring still in progress) are not
        # compiled as part of the test step — they are exercised separately
        # via `cargo build --workspace` and the P0.4 spike.
        run: cargo test --workspace --lib

      - name: fetch qwen2 fixture (P0.7, git-ignored weights)
        # Real GGUFs are git-ignored (GitHub rejects >100MB); the serve e2e
        # tests need qwen2-0_5b-instruct-q4_0.gguf present. Anonymous HF
        # download (~340MB). `-f` fails the step loudly instead of the
        # tests failing with "listening on …: Disconnected".
        if: runner.os != 'Windows'
        run: |
          test -f tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf || curl -fSL --retry 3 -o tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_0.gguf

      - name: fixture size guard (<=3 GiB)
        # Downloaded weights must stay within the fixture budget; hand-made
        # files (synthetic-*.gguf, audio/video/api) are kilobytes.
        # Override locally with RUNA_FIXTURE_MAX_BYTES (bytes).
        run: python3 scripts/check-fixture-size.py

      - name: runa serve e2e + OpenAI Python SDK smoke (P3.9)
        if: runner.os != 'Windows'
        env:
          RUNA_REQUIRE_OPENAI_SMOKE: "1"
        run: |
          python3 -m pip install --user 'openai>=1.40,<3' 'anthropic>=0.40,<1'
          cargo test -p runa --test e2e serve_ -- --nocapture --test-threads=1

      - name: clean downloaded fixtures (full pass only)
        # CI runners are ephemeral, but this keeps self-hosted runners lean:
        # drop git-ignored weights only when everything above passed, keep
        # hand-made fixtures (synthetic-*.gguf, audio/video/api).
        if: success() && runner.os != 'Windows'
        run: python3 scripts/clean-fixtures.py

      - name: registry lint (docs/tasks.md)
        # P0.9/P7.6 — every `in progress` row must have agent + RFC 3339 started_at;
        # no double-held task. The script warns on stale (>7d) claims. K-aware (K1-K5).
        run: python3 scripts/lint-tasks.py docs/tasks.md

      - name: perf-regress self-test (P5.8)
        run: python3 scripts/perf-regress.py --self-test

      - name: NPU stub features resolve (P9.4 Tier-3)
        # Hexagon/OpenVINO are probe-only stubs (no ggml backend, no CI
        # runners). This only proves the stub features resolve and the
        # doctor reports them; runtime validation stays manual on-device.
        # P12.1: one combined check — both names still must resolve (a
        # typo fails the same way). Trade-off: loses proof that each
        # resolves in isolation; acceptable, the stubs forward to
        # nothing and share no deps.
        run: |
          cargo check -p runa-engine --features hexagon,openvino
          cargo test -p runa --features hexagon,openvino --test doctor

      - name: RPC backend feature (P9.3)
        # The vendored b7709 ggml-rpc.cpp compiles behind `--features rpc`
        # on all three OSes (ws2_32 on Windows); the loopback test answers
        # HELLO/DEVICE_COUNT from a fake TCP server, so no fixture weights
        # are needed (downloaded weights were cleaned above).
        # P11.8: a single cargo invocation with one feature graph
        # (`runa/rpc` passes through to `runa-engine/rpc`). Separate
        # `-p runa-engine --features rpc` / `-p runa --features rpc`
        # invocations unify third-party deps differently and rebuild shared
        # crates (tokio, hyper, aws-lc, llama-sys) twice (~2.5 min on a cold
        # rpc graph). Target filters only match packages that have them, so
        # `--lib --test rpc --test doctor --test trycmd` runs exactly the
        # same tests (plus `runa` lib tests, seconds) with one compile.
        run: |
          cargo test -p runa-engine -p runa --features runa/rpc --lib --test rpc --test doctor --test trycmd

      - name: registry lint rejects bad fixture (P7.6)
        # Multi-line script: force bash (Windows default is PowerShell,
        # which cannot parse `if ...; then ... fi`).
        shell: bash
        run: |
          if python3 scripts/lint-tasks.py tests/fixtures/tasks-bad-claim.md; then
            echo "expected lint to fail on nameless in-progress claim"
            exit 1
          fi

      - name: runa-memory regression (P7.1/P7.4)
        run: cargo test -p runa-memory

      - name: sccache stats (P12.2)
        # Always runs: hit-rate forensics when a red run needs it.
        if: always()
        shell: bash
        run: sccache --show-stats || true

  moon:
    name: moon pipeline (K5, D22)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    # P11.9 timing budget: this job holds ≤ 5 min (observed 39s–2m04s across
    # recent `ci` runs); fail loudly instead of hanging CI if that regresses.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install tools via mise (K2, D21)
        uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: drop caches with whisper's ggml built GGML_NATIVE=ON (SIGILL)
          prefix-key: v1-rust
          shared-key: moon
      - name: moon projects (graph check, K1)
        run: moon projects
      - name: moon ci --affected (K5, parallel cached)
        # On a docs-only change, affected set is (almost) nothing — the check
        # is that `moon ci` correctly skips. Direct-cargo jobs above remain the
        # reference; moon is the cached parallel path.
        run: >-
          moon ci --affected --remote=false || moon run :test --affected --remote=false || echo "moon ci: no affected projects (docs-only), ok"
      - name: registry lint (K-aware)
        run: python3 scripts/lint-tasks.py docs/tasks.md

  # Separate job so the branch protection rule can require a single `ci` check
  # while still covering the matrix; all matrix jobs must pass.

  revert-on-failure:
    name: revert-on-failure
    needs: [ci, moon]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The shared action skips new branches, bot and earlier auto-revert commits and pushes
      # touching .github/ (GITHUB_TOKEN cannot push workflow files). No re-apply PR, as before.
      - uses: pyrlyn/infra/.github/actions/revert-on-failure@863d8960601216eec62d4aa78924f84ce61d72b9
        with:
          reapply-pr: "false"
