# Gradle build of the Kotlin/Native CLI (PLAN.md, section 10): `./gradlew check` and the release
# executable on each target's own runner, since a target's tests run only on its own OS. Job
# names `<os> (<target>)` are the checks to require on main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@9675ff42a0e3785beabccb68b0e4fa65910de453 # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-14"]'

  # `docs-only` is "true" when every changed file is documentation (.github/infra.yml); it fails
  # open, so a failed `config` runs everything.
  config:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@9675ff42a0e3785beabccb68b0e4fa65910de453 # main

  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    needs: [config, macos-runner]
    # Draft PRs skip. A docs-only change still runs the job with every step a no-op, so the
    # required `<os> (<target>)` checks report instead of waiting.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Fork PRs keep the hosted macOS label; MACOS_CI_DISABLED moves the macOS job to Ubuntu as a no-op.
    runs-on: ${{ vars.MACOS_CI_DISABLED == 'true' && startsWith(matrix.os, 'macos') && 'ubuntu-24.04' || startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macosArm64
            task: MacosArm64
          - os: ubuntu-24.04
            target: linuxX64
            task: LinuxX64
    env:
      RUN: ${{ needs.config.outputs.docs-only != 'true' && !(vars.MACOS_CI_DISABLED == 'true' && startsWith(matrix.os, 'macos')) }}
      SKIP_TESTS: ${{ vars.SKIP_CI_TESTS == 'true' }}
      TEST_MODEL: bartowski/Qwen2.5-0.5B-Instruct-GGUF@Q4_K_M
      TEST_MODEL_FILE: bartowski/Qwen2.5-0.5B-Instruct-GGUF/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - if: env.RUN == 'true'
        name: Install tools (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true

      - if: env.RUN == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - if: env.RUN == 'true'
        name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Check (tests and ktlint)
        run: ./gradlew check --console=plain

      - if: env.RUN == 'true' && env.SKIP_TESTS == 'true'
        name: tests skipped (SKIP_CI_TESTS)
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"

      - if: env.RUN == 'true'
        name: Link the release executable
        run: ./gradlew :app:linkReleaseExecutable${{ matrix.task }} --console=plain

      - if: env.RUN == 'true'
        name: Smoke test
        run: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe --version

      # Integration (PLAN.md, phase 4): the engine tests skip without real weights, so one small
      # public model is fetched with runa itself, which checks its SHA-256, and kept in a cache.
      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        id: model
        name: Cache the test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runa/models
          key: test-model-qwen2.5-0.5b-instruct-q4_k_m

      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true' && steps.model.outputs.cache-hit != 'true'
        name: Download the test model
        env:
          RUNA_HOME: ${{ runner.temp }}/runa
        run: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe --yes get "$TEST_MODEL"

      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Engine tests on the test model
        env:
          RUNA_TEST_MODEL: ${{ runner.temp }}/runa/models/${{ env.TEST_MODEL_FILE }}
        run: ./gradlew :engine-llama:${{ matrix.target }}Test --console=plain

      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: The same seed gives the same answer
        env:
          RUNA_HOME: ${{ runner.temp }}/runa
          RUNA: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe
        run: |
          ask() { "$RUNA" run "$TEST_MODEL" "Name three colours." --temp 0 --seed 1 --max-tokens 32; }
          first="$(ask)"
          second="$(ask)"
          printf '%s\n' "$first"
          test -n "$first"
          test "$first" = "$second"

      # Integration (PLAN.md, phase 5): the real daemon process, started, loaded, killed and stopped.
      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Daemon integration test
        env:
          RUNA: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe
          MODELS: ${{ runner.temp }}/runa/models
        run: app/integration/daemon.sh "$RUNA" "$MODELS" "$TEST_MODEL"

      # Integration (PLAN.md, phase 6): the OpenAI-compatible server, with curl as its client.
      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Server integration test
        env:
          RUNA: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe
          MODELS: ${{ runner.temp }}/runa/models
        run: app/integration/server.sh "$RUNA" "$MODELS" "$TEST_MODEL"

      # Integration (PLAN.md, phase 6): `runa chat` in a pipe and the conversations behind it.
      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Chat integration test
        env:
          RUNA: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe
          MODELS: ${{ runner.temp }}/runa/models
        run: app/integration/chat.sh "$RUNA" "$MODELS" "$TEST_MODEL"

      - if: env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runa-${{ matrix.target }}
          path: app/build/bin/${{ matrix.target }}/releaseExecutable/runa.kexe
          if-no-files-found: error
