name: coderabbit-issues

# One GitHub issue per actionable CodeRabbit inline review comment: title from the comment's
# first line, PR link, file and line, the comment body, label `coderabbit` (created when
# missing), assigned to @listepo, and a hidden `<!-- coderabbit-comment-id: N -->` marker so a
# comment never gets two issues. Nitpicks, warnings, notices, summaries, status comments and
# replies are skipped. Runs only for coderabbitai[bot]; needs no secrets (on a fork's pull
# request the token is read-only and the run only logs a warning).
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Per pull request and author, so a human comment never replaces a queued CodeRabbit run.
  group: coderabbit-issues-${{ github.event.pull_request.number }}-${{ github.event.sender.login }}
  cancel-in-progress: false

permissions: {}

jobs:
  issues:
    if: >-
      github.event.review.user.login == 'coderabbitai[bot]'
      || github.event.comment.user.login == 'coderabbitai[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: File CodeRabbit findings as issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BOT: coderabbitai[bot]
          LABEL: coderabbit
          ASSIGNEE: listepo
          MAX_CREATE: "20"
        with:
          script: |
            // One GitHub issue per actionable CodeRabbit inline review comment.
            // Env: BOT, LABEL, ASSIGNEE (empty = nobody), MAX_CREATE, DRY_RUN.
            const bot = process.env.BOT || 'coderabbitai[bot]';
            const label = process.env.LABEL || 'coderabbit';
            const assignee = process.env.ASSIGNEE || '';
            const maxCreate = Number(process.env.MAX_CREATE || '20');
            const dryRun = process.env.DRY_RUN === 'true';
            const { owner, repo } = context.repo;
            const p = context.payload;
            const pr = p.pull_request;
            if (!pr) {
              core.info('No pull request in the event; nothing to do.');
              return;
            }

            let candidates;
            if (context.eventName === 'pull_request_review') {
              if (!p.review || p.review.user.login !== bot) {
                core.info('Not a CodeRabbit review; skipped.');
                return;
              }
              const all = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              candidates = all.filter((c) => c.pull_request_review_id === p.review.id);
            } else if (context.eventName === 'pull_request_review_comment') {
              if (!p.comment || p.comment.user.login !== bot) {
                core.info('Not a CodeRabbit comment; skipped.');
                return;
              }
              candidates = [p.comment];
              if (p.comment.pull_request_review_id) {
                // Cover the whole review: a queued run of the same pull request may have been replaced.
                const all = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: pr.number, per_page: 100,
                });
                candidates = all.filter(
                  (c) => c.pull_request_review_id === p.comment.pull_request_review_id,
                );
              }
            } else {
              core.info(`Unsupported event ${context.eventName}; skipped.`);
              return;
            }

            // Inline findings only: replies, summaries, status notes, warnings and nitpicks are noise.
            // CodeRabbit's "Potential issue" badge carries a warning sign but is a finding and is kept.
            const head = (body) => body.replace(/<!--[\s\S]*?-->/g, '').split('\n')
              .map((l) => l.trim()).filter(Boolean).slice(0, 3).join('\n');
            function noiseReason(c) {
              const body = c.body || '';
              const h = head(body);
              if (c.in_reply_to_id) return 'reply';
              if (!c.user || c.user.login !== bot) return 'not CodeRabbit';
              if (/auto-generated comment: (summarize|review status|walkthrough)/i.test(body)) {
                return 'summary/status';
              }
              if (/nitpick/i.test(h)) return 'nitpick';
              if (/\[!(WARNING|CAUTION|NOTE|TIP|IMPORTANT)\]/.test(h)) return 'notice';
              if (/^[>*_\s]*(?:⚠️\s*)?warning\b/i.test(h)) return 'warning';
              if (/rate limit|review (?:was )?skipped|review failed/i.test(h)) return 'status';
              return '';
            }

            function titleOf(body) {
              const text = body.replace(/<!--[\s\S]*?-->/g, '');
              for (let line of text.split('\n')) {
                line = line.trim();
                if (!line) continue;
                // Badge line, e.g. "_⚠️ Potential issue_ | _🟠 Major_".
                if (/^_[^_]+_(\s*\|\s*_[^_]+_)*$/.test(line)) continue;
                if (/^<\/?(details|summary|blockquote)/i.test(line)) continue;
                line = line.replace(/\*\*/g, '').replace(/^#+\s*/, '').replace(/\s+/g, ' ').trim();
                if (line) return line.length > 120 ? `${line.slice(0, 117)}...` : line;
              }
              return 'CodeRabbit finding';
            }
            function badgeOf(body) {
              const line = body.split('\n').map((l) => l.trim()).find(Boolean) || '';
              return /^_[^_]+_(\s*\|\s*_[^_]+_)*$/.test(line) ? line : '';
            }
            // Comment text is untrusted: no forged markers, no @mentions outside code blocks.
            function clean(body) {
              return body.replace(/<!--[\s\S]*?-->/g, '').split(/(```[\s\S]*?```)/g)
                .map((part, i) => (i % 2 ? part
                  : part.replace(/(^|[^\w`])@(?=[A-Za-z0-9])/g, '$1@\u200b')))
                .join('').trim();
            }

            const findings = [];
            for (const c of candidates) {
              const why = noiseReason(c);
              if (why) core.info(`comment ${c.id}: skipped (${why})`);
              else findings.push(c);
            }
            if (!findings.length) {
              core.info('No actionable CodeRabbit findings.');
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: label, state: 'all', per_page: 100,
            });
            const known = new Set();
            for (const i of issues) {
              const ids = (i.body || '').matchAll(/<!-- coderabbit-comment-id: (\d+) -->/g);
              for (const m of ids) known.add(m[1]);
            }

            const created = [];
            const deferred = [];
            let labelReady = false;
            for (const c of findings) {
              if (known.has(String(c.id))) {
                core.info(`comment ${c.id}: issue already exists`);
                continue;
              }
              if (created.length >= maxCreate) {
                deferred.push(c.html_url);
                continue;
              }
              const end = c.line ?? c.original_line;
              const start = c.start_line ?? c.original_start_line;
              const lines = start && end && start !== end ? `${start}-${end}` : `${end ?? '?'}`;
              const badge = badgeOf(c.body || '');
              const title = `CodeRabbit: ${titleOf(c.body || '')}`;
              const body = [
                `CodeRabbit finding on #${pr.number} (${pr.html_url}).`,
                '',
                `- File: \`${c.path}\`, line ${lines} ([review comment](${c.html_url}))`,
                `- Commit: \`${(c.commit_id || c.original_commit_id || '').slice(0, 12)}\``,
                badge ? `- Kind: ${badge}` : '',
                '',
                '---',
                '',
                clean(c.body || '').slice(0, 60000),
                '',
                `<!-- coderabbit-comment-id: ${c.id} -->`,
              ].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');
              if (dryRun) {
                core.info(`would create: ${title}`);
                created.push(title);
                continue;
              }
              try {
                if (!labelReady) {
                  try {
                    await github.rest.issues.getLabel({ owner, repo, name: label });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                    await github.rest.issues.createLabel({
                      owner, repo, name: label, color: 'ff7f50',
                      description: 'Finding from a CodeRabbit review',
                    });
                  }
                  labelReady = true;
                }
                const params = { owner, repo, title, body, labels: [label] };
                let res;
                try {
                  res = await github.rest.issues.create(
                    assignee ? { ...params, assignees: [assignee] } : params,
                  );
                } catch (e) {
                  if (!assignee || e.status !== 422) throw e;
                  res = await github.rest.issues.create(params);
                }
                core.info(`comment ${c.id}: created ${res.data.html_url}`);
                created.push(res.data.html_url);
              } catch (e) {
                if (e.status === 403) {
                  // A fork's pull request gets a read-only token; nothing is lost, the comment stays.
                  core.warning(`Cannot create issues with this token (${e.message}); fork pull request?`);
                  break;
                }
                throw e;
              }
            }
            await core.summary.addHeading('CodeRabbit findings', 3)
              .addList(created.length ? created : ['(no new issues)'])
              .addRaw(deferred.length ? `Deferred to a later run: ${deferred.length}\n` : '')
              .write();
