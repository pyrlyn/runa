name: license-check

# Fails when LICENSE, PRICING.md or the README license-sync block drift from the canonical
# copies in pyrlyn/ci (licenses/, the single source of truth). The job summary shows the
# diff; pyrlyn/ci's chore/license-sync pull request brings the copies back in line.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license:
    # The canonical files are read from pyrlyn/ci main (canonical-ref default).
    uses: pyrlyn/ci/.github/workflows/license-check.yml@2f03a5d7ef6b77a3e1c6b9bccbb603c067d6af08 # main 2026-10-06
    permissions:
      contents: read
      actions: write # cancel-run on failure
