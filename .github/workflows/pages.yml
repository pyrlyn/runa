# Build the runa site (Hugo extended + Tailwind, site/) and deploy it to GitHub Pages through
# pyrlyn/infra's pages.yml.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  pages:
    uses: pyrlyn/infra/.github/workflows/pages.yml@863d8960601216eec62d4aa78924f84ce61d72b9
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise: false
      node-version: "22"
      node-cache-dependency-path: site/package-lock.json
      working-directory: site
      # Hugo extended 0.152.2 (was peaceiris/actions-hugo).
      setup-command: |
        v=0.152.2
        url=https://github.com/gohugoio/hugo/releases/download/v$v
        curl -fsSL "$url/hugo_extended_${v}_linux-amd64.tar.gz" | tar -xz hugo
        sudo install -m 755 hugo /usr/local/bin/hugo
        hugo version
        npm ci
      build-command: npm run build:css && hugo --minify --destination public
      artifact-path: site/public
