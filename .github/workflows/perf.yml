# P5.8 — nightly `runa bench` regression (>3 % pp/tg drop fails).
# First report used GitHub-hosted runners (macos-14 / ubuntu-22.04 CPU).
# Pin self-hosted mac + Linux labels here when those machines exist.
name: perf
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-14-cpu
          - os: ubuntu-22.04
            label: ubuntu-22.04-cpu
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          # v2: `--profile dist` artifacts live under target/dist, which the
          # v1 (release-profile) caches lack — and rust-cache skips saving on
          # an exact key hit ("Cache up-to-date"), so without a key bump the
          # new-profile artifacts would never enter the cache and every run
          # would pay a full cold build. v2 re-caches dist-only (smaller than
          # the old release-only entries, easing the 10 GiB repo quota).
          prefix-key: v2-rust-dist
          shared-key: perf-${{ matrix.label }}
          cache-on-failure: true
      - name: "fetch qwen2 fixture + build runa (P11.9 overlapped)"
        # `runa bench` needs the real file; without it bench.json stays
        # empty and perf-regress dies on JSONDecodeError (red since before
        # P10). Same anonymous-HF fetch as ci.yml.
        # P11.9 timing: the ~340MB download (~7s) runs in the background
        # while cargo builds, then `wait` fails the step loudly if curl
        # failed — same ordering guarantee as the old separate step
        # (fixture present before bench), less wall time. No work skipped.
        run: |
          test -f tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf || curl -fSL --retry 3 -o tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_0.gguf &
          FETCH_PID=$!
          # P11.9 timing: `--profile dist` (thin LTO) instead of `--release`
          # (fat LTO). Same sources, same rustc otherwise; the hot inference
          # path is vendored C++ (`cc` in runa-engine/build.rs), untouched by
          # Rust LTO mode — while the final-crate fat-LTO link is the ~3.5 min
          # bottleneck. `dist` is also the cargo-dist ship profile
          # (`[profile.dist]`: "Thin LTO so CI release jobs finish"), so perf
          # measures the binary users actually download.
          cargo build -p runa --profile dist
          wait $FETCH_PID
      - name: runa bench --json (pp512/tg128)
        env:
          RUNA_NO_PROMPT_CACHE: "1"
        run: |
          # ctx must be >= pp+tg+1 (512+128+1 = 641); 512 is too small.
          ./target/dist/runa bench --mode cpu --ctx 1024 --pp 512 --tg 128 --json \
            tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf | tee bench.json
      - name: regress vs docs/perf-baseline.json
        run: |
          python3 scripts/perf-regress.py \
            --current bench.json \
            --baseline docs/perf-baseline.json \
            --key ${{ matrix.label }} \
            --max-drop 0.03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.label }}
          path: bench.json
