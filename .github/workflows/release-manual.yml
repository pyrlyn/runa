# P14.1 — manual release: pick patch/minor/major in the Actions UI.
# Runs scripts/release.sh with the chosen level (which commits, pushes and
# tags vX.Y.Z); the dist-generated release.yml then builds and publishes.
# Inputs mirror scripts/release.sh: level + dry-run/local mode.
name: release-manual

on:
  workflow_dispatch:
    inputs:
      level:
        description: Which part to bump when the current version is already tagged
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      mode:
        description: Run mode ('' = commit+push+tag; --dry-run prints only; --local commits without push/tag)
        required: false
        default: ''
        type: choice
        options: ['', --dry-run, --local]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ inputs.level }} ${{ inputs.mode }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools via mise (K2, D21)
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run release script
        env:
          LEVEL: ${{ inputs.level }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$MODE" ]; then
            bash scripts/release.sh "$LEVEL"
          else
            bash scripts/release.sh "$LEVEL" "$MODE"
          fi

  # A failed real release (not --dry-run or --local) opens or comments on a `release-failure`
  # issue that mentions and assigns @listepo (pyrlyn/infra notify-release-failure): GitHub
  # cannot filter Actions notifications per workflow. The dist Release workflow it starts is
  # covered by release-failure.yml. Pinned to pyrlyn/infra ci/notify-release-failure; repin to
  # its merge commit.
  notify-failure:
    needs: release
    if: always() && inputs.mode == '' && needs.release.result == 'failure'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read # failed job names
      issues: write
    steps:
      - uses: pyrlyn/infra/.github/actions/notify-release-failure@d709124d53dd4923eff8f594b3155842508b0049
        with:
          needs: ${{ toJSON(needs) }}
