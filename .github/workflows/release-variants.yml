# GPU feature variants (P6.3). cargo-dist ships portable CPU archives;
# this workflow adds Metal / Vulkan / CUDA binaries to the same GitHub Release.
#
# CUDA needs the NVIDIA toolkit on the runner. Vulkan needs libvulkan-dev.

name: release-variants

# Dispatched by bump.yml (pyrlyn/infra) with `--ref <tag> -f tag=<tag>` right
# after it creates the tag and the draft release; no tag-push trigger, since
# bump is the only tagger and a tag it pushes with GITHUB_TOKEN starts nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose GitHub Release should receive extra archives
        required: true

jobs:
  macos-metal:
    runs-on: macos-14
    permissions:
      contents: write
    # P14.2: best-effort like the other GPU variants — nothing may block the
    # portable CPU release (the artifacts ketch installs). If the metal
    # build itself fails the job still reports it; only the wait-for-Release
    # gate is allowed to pass silently (it depends on dist, not on us).
    continue-on-error: true
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: drop caches with whisper's ggml built GGML_NATIVE=ON (SIGILL)
          prefix-key: v1-rust
          shared-key: release-macos-metal
      - name: Build Metal variant
        run: cargo build --release -p runa --features metal
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-variant
          cp target/release/runa dist-variant/runa
          tar -C dist-variant -cJf "runa-aarch64-apple-darwin-metal.tar.xz" runa
      - name: Wait for GitHub Release then upload
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" runa-aarch64-apple-darwin-metal.tar.xz --clobber
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for GitHub Release $TAG" >&2
          exit 1

  linux-vulkan:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # P14.2: non-blocking — llama-cpp 0.1.133 ggml-vulkan needs a newer
    # Vulkan-Hpp than ubuntu-22.04 ships (`PipelineRobustnessCreateInfoEXT`
    # missing; LunarG shaderc alone does not fix it). The portable CPU
    # archive is what ketch installs; the vulkan variant is best-effort.
    continue-on-error: true
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan headers
        # P14.2: ggml-vulkan FindVulkan needs glslc to compile its SPIR-V
        # shaders at build time, and Ubuntu 22.04 stock repos have no glslc
        # package — glslang-tools only ships glslangValidator (different
        # CLI). Pull the small `shaderc` package from the LunarG apt repo
        # instead of the 600+ MB `vulkan-sdk` meta-package. Then fail fast
        # if glslc is still not on PATH.
        run: |
          sudo apt-get update && sudo apt-get install -y libvulkan-dev glslang-tools
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan jammy main" \
            | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list >/dev/null
          sudo apt-get update && sudo apt-get install -y shaderc
          command -v glslc
          glslc --version | head -1
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: drop caches with whisper's ggml built GGML_NATIVE=ON (SIGILL)
          prefix-key: v1-rust
          shared-key: release-linux-vulkan
      - name: Build Vulkan variant
        run: cargo build --release -p runa --features vulkan
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-variant
          cp target/release/runa dist-variant/runa
          tar -C dist-variant -cJf "runa-x86_64-unknown-linux-gnu-vulkan.tar.xz" runa
      - name: Wait for GitHub Release then upload
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" runa-x86_64-unknown-linux-gnu-vulkan.tar.xz --clobber
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for GitHub Release $TAG" >&2
          exit 1

  linux-cuda:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # P14.2: best-effort (see macos-metal above).
    continue-on-error: true
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.4.0"
          method: network
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: drop caches with whisper's ggml built GGML_NATIVE=ON (SIGILL)
          prefix-key: v1-rust
          shared-key: release-linux-cuda
      - name: Build CUDA variant
        run: cargo build --release -p runa --features cuda
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-variant
          cp target/release/runa dist-variant/runa
          tar -C dist-variant -cJf "runa-x86_64-unknown-linux-gnu-cuda.tar.xz" runa
      - name: Wait for GitHub Release then upload
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" runa-x86_64-unknown-linux-gnu-cuda.tar.xz --clobber
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for GitHub Release $TAG" >&2
          exit 1
