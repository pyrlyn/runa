# P14.1 — on-demand review: runs only when someone comments `/review` on a
# ready (non-draft) PR targeting main. Reuses the CI checks (fmt, clippy,
# build, workspace lib tests, registry lint) on ubuntu only for speed;
# the full matrix stays in ci.yml.
name: review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    name: gate /review command
    # Only PR comments (not issues), only the `/review` command, only PRs
    # targeting main that are open and not drafts. The review job runs the PR's
    # code (build scripts, mise tools), so only people with write access may
    # trigger it: any GitHub user can comment on a public PR.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
    steps:
      - name: Resolve PR head (must target main, must not be draft)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --json baseRefName,isDraft,headRefOid,headRefName,state \
            --jq '{base: .baseRefName, draft: .isDraft, sha: .headRefOid, ref: .headRefName, state: .state}')
          echo "$pr"
          base=$(echo "$pr" | jq -r .base)
          draft=$(echo "$pr" | jq -r .draft)
          state=$(echo "$pr" | jq -r .state)
          [ "$base" = "main" ] || { echo "PR does not target main ($base); skip"; exit 1; }
          [ "$draft" = "false" ] || { echo "PR is draft; skip"; exit 1; }
          [ "$state" = "OPEN" ] || { echo "PR is not open ($state); skip"; exit 1; }
          echo "sha=$(echo "$pr" | jq -r .sha)" >> "$GITHUB_OUTPUT"
          echo "ref=$(echo "$pr" | jq -r .ref)" >> "$GITHUB_OUTPUT"
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Review requested — running checks on \`${{ steps.pr.outputs.sha }}\`." || true

  review:
    name: review checks (ubuntu)
    needs: gate
    runs-on: ubuntu-22.04
    # Untrusted PR code runs here: no write scopes and no token left in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install tools via mise (K2, D21)
        uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: review-x86_64-unknown-linux-gnu
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace -- -D warnings
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib
      - name: registry lint (docs/tasks.md)
        run: python3 scripts/lint-tasks.py docs/tasks.md
      - name: runa-memory regression (P7.1/P7.4)
        run: cargo test -p runa-memory

  report:
    name: report back to PR
    needs: [gate, review]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.review.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            body="Review: all checks passed on \`${{ needs.gate.outputs.sha }}\` (fmt, clippy, build, lib tests, registry lint, runa-memory)."
          else
            body="Review: checks **$RESULT** on \`${{ needs.gate.outputs.sha }}\` — see the \`review\` workflow run for details."
          fi
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body"
