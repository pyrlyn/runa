# Publishes this repo's docs/ to the public site repository pyrlyn/landing on its main branch; a
# push there deploys https://pyrlyn.github.io/landing/ via GitHub Pages:
#   - docs/site.md (the project card) -> content/projects/<this repo's name>.md, when it exists;
#     its front matter follows CONTENT_CONTRACT.md in pyrlyn/landing. runa has no card yet, so
#     only its docs are synced. Localized cards docs/ru/site.md and docs/uk/site.md, if added,
#     -> content/projects/ru/<name>.md and content/projects/uk/<name>.md.
#   - every other English docs/**/*.md -> content/docs/<this repo's name>/ (mirrored: files
#     removed here are removed there; the ru/ and uk/ folders are left out of this mirror and
#     protected from its --delete), plus _source.json with the source repo, commit and ref. The
#     site renders them as /landing/<name>/docs/<page>/ and links other relative paths back to
#     this repo at that commit. Page order and titles live in src/data/docs-nav.json in
#     pyrlyn/landing.
#   - every docs/<lang>/**/*.md translation (lang: ru, uk; except docs/<lang>/site.md) ->
#     content/docs/<name>/<lang>/, mirrored with its own --delete. The site renders them as
#     /landing/<lang>/<name>/docs/<page>/; a page without a translation falls back to English.
#
# Auth is a write-enabled deploy key on pyrlyn/landing only; its private half is this repo's
# SITE_DEPLOY_KEY secret. GITHUB_TOKEN stays read-only. This workflow is independent of the
# pipeline gate, releases and Pages: it never builds, tests or deploys this repository.
#
# On a v* tag or release every card's `version:` front matter (English, ru and uk) is set from
# the tag (v1.2.3 -> "1.2.3"), once docs/site.md exists.
name: sync-docs

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every v* tag syncs.
    paths: [docs/**, .github/workflows/sync-docs.yml]
    tags: ["v*"]
  # A tag pushed with GITHUB_TOKEN triggers no workflow, so also sync when a release is published
  # (its ref is the release tag, so the version below is set the same way); workflow_dispatch
  # remains the manual fallback.
  release:
    types: [published]
  workflow_dispatch:

# One sync at a time per source repo, never cancelled half-way; the push below fetches and
# rebases (up to 5 attempts) when another repo's sync landed on pyrlyn/landing first.
concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pyrlyn/landing
          ref: main
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      - name: Copy the project cards (docs/site.md, docs/ru/site.md, docs/uk/site.md) into the site repository
        env:
          PROJECT: ${{ github.event.repository.name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # runa has no docs/site.md yet, so the site has no runa card and this step does nothing
          # (docs only). Once docs/site.md exists it becomes content/projects/<name>.md, and an
          # optional docs/<lang>/site.md becomes content/projects/<lang>/<name>.md.
          if [ ! -f source/docs/site.md ]; then
            echo "::notice::docs/site.md does not exist: no project card to sync, docs only"
            exit 0
          fi
          for lang in "" ru uk; do
            src="source/docs/${lang:+$lang/}site.md"
            dest="site/content/projects/${lang:+$lang/}${PROJECT}.md"
            if [ ! -f "$src" ]; then
              rm -f "$dest"
              continue
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            if [ "$REF_TYPE" = "tag" ]; then
              VERSION="${REF_NAME#v}" DEST="$dest" python3 - <<'PY'
          import os, re
          path, version = os.environ["DEST"], os.environ["VERSION"]
          text = open(path, encoding="utf-8").read()
          m = re.match(r"---\n(.*?\n)---\n", text, re.S)
          if m:
              fm = m.group(1)
              line = f'version: "{version}"\n'
              if re.search(r"^version:.*\n", fm, re.M):
                  fm = re.sub(r"^version:.*\n", line, fm, count=1, flags=re.M)
              else:
                  fm += line
              text = f"---\n{fm}---\n" + text[m.end():]
              open(path, "w", encoding="utf-8").write(text)
          PY
            fi
          done
      - name: Mirror the other docs/**/*.md and their ru and uk translations into the site repository
        env:
          PROJECT: ${{ github.event.repository.name }}
          SOURCE: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dest="site/content/docs/${PROJECT}"
          mkdir -p "$dest"
          # English. The locale folders are not part of this mirror: excluded on the sending side
          # and protected (P) on the receiving side, so --delete / --delete-excluded never touch
          # content/docs/<name>/ru/ or uk/; each locale is mirrored by its own rsync below.
          rsync -a --delete --delete-excluded --prune-empty-dirs \
            --filter='P /ru/' --filter='P /uk/' \
            --exclude='/ru/' --exclude='/uk/' \
            --exclude='/site.md' \
            --include='*/' --include='*.md' --exclude='*' \
            source/docs/ "$dest/"
          # Translations: docs/<lang>/**/*.md -> content/docs/<name>/<lang>/, with English file
          # names; docs/<lang>/site.md is a card (previous step), never a doc page.
          for lang in ru uk; do
            if [ -d "source/docs/${lang}" ]; then
              mkdir -p "$dest/${lang}"
              rsync -a --delete --delete-excluded --prune-empty-dirs \
                --exclude='/site.md' \
                --include='*/' --include='*.md' --exclude='*' \
                "source/docs/${lang}/" "$dest/${lang}/"
            else
              rm -rf "${dest:?}/${lang}"
            fi
          done
          printf '{\n  "repo": "%s",\n  "sha": "%s",\n  "ref": "%s"\n}\n' \
            "$SOURCE" "$SOURCE_SHA" "$REF_NAME" > "$dest/_source.json"
      - name: Commit and push if changed
        working-directory: site
        env:
          PROJECT: ${{ github.event.repository.name }}
          SOURCE: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The checkout is fresh, so content/projects/ holds only this run's card changes; -A also
          # stages a localized card the copy step removed.
          git add -A -- content/projects "content/docs/${PROJECT}"
          # _source.json alone changes on every run; only commit when content changed.
          if git diff --cached --quiet -- . ":(exclude)content/docs/${PROJECT}/_source.json"; then
            echo "the ${PROJECT} cards and content/docs/${PROJECT}/ are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: sync ${PROJECT} from ${SOURCE}@${SOURCE_SHA:0:7} (${REF_NAME})"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed $(git rev-parse HEAD) to pyrlyn/landing main"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the latest main"
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push to pyrlyn/landing main after 5 attempts"
          exit 1
