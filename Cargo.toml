[profile.release]
codegen-units = 1
lto = "fat"

# cargo-dist installers (P6.3) and the GPU variants (release-variants.yml): the
# `dev` profile, so every release is a dev build (unoptimized, debug info, no LTO).
[profile.dist]
inherits = "dev"

[workspace]
members = ["crates/*"]
# cargo-fuzz targets (own workspace, nightly only): fuzz/README.md.
exclude = ["fuzz"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
clap = "4"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"
version = "0.1.0"
