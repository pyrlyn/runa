[profile.release]
codegen-units = 1
lto = "fat"

# cargo-dist installers (P6.3). Thin LTO so CI release jobs finish.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["crates/*"]
# cargo-fuzz targets (own workspace, nightly only): fuzz/README.md.
exclude = ["fuzz"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
clap = "4"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.1.0"
