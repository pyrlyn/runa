[package]
name = "runa-cloud"
description = "openai (async-openai) + anthropic (reqwest+SSE) adapters, price table"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-openai = { version = "=0.42.2", default-features = false, features = ["chat-completion", "responses", "rustls"] }
futures = "0.3.34"
# P17.19: OS keychain read and the inline-secret scan. Not on crates.io;
# the same git pin style as `config-schema` in `runa-models`.
keychain-secret = { git = "https://github.com/pyrlyn/crates", rev = "f0deed54f6f8166b31404c2129b59355c45cf044" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
runa-core = { version = "0.1.0", path = "../runa-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "=1.1.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

