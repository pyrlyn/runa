[package]
name = "runa-engine"
description = "llama-cpp-2 wrapper: load, placement, sampling loop, mtmd, state save"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
mtmd = ["llama-cpp-2/mtmd", "llama-cpp-sys-2/mtmd"]
# P9.2: mistral.rs backend for safetensors / omni models ggml cannot run.
# Optional so the default build stays GGUF-only (no candle in the tree);
# `runa doctor` reports whether this binary has it.
mistralrs = ["dep:mistralrs"]
# GPU backends are opt-in cargo features (plan D13: backends are features;
# `runa doctor` reports what the binary was built with — P1.6/P6.3).
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
# P9.4 NPU backends (Tier 3, probe-only stubs): `llama-cpp-2` exposes NO
# `hexagon`/`openvino` features through 0.1.154 (surveyed 2026-09-15, see
# `docs/versions.md`), so these cargo features forward to nothing yet. They
# exist to gate `cfg(feature = ...)` code (build.rs SDK warning, `doctor`
# strings) and to reserve the names for the day upstream lands them — then
# uncomment the `llama-cpp-2/...` forwarding below. SDKs (manual on-device
# validation only; no CI runners): Hexagon needs `HEXAGON_SDK_ROOT`
# (Qualcomm Hexagon SDK); OpenVINO needs `INTEL_OPENVINO_DIR` (OpenVINO
# `setupvars.sh`). Enabling either feature today changes no placement:
# tensors stay on CPU (plan D12, no silent acceleration claims).
hexagon = [
    # "llama-cpp-2/hexagon", # P9.4: no such feature through llama-cpp-2 0.1.154
]
openvino = [
    # "llama-cpp-2/openvino", # P9.4: no such feature through llama-cpp-2 0.1.154
]
# P5.7: local `-C target-cpu=native` (GGML_NATIVE=ON). Portable releases omit this;
# ggml runtime-dispatches AVX2/AVX-512/NEON. Pair with RUSTFLAGS='-C target-cpu=native'.
native = []
# P9.3: real ggml RPC backend. Compiles the vendored b7709 `ggml-rpc.cpp`
# (see `rpc/README.md`) and enables `--rpc` registration in `load()`.
# Without this feature `--rpc` fails explicitly with `Unsupported`.
# Default builds stay GGUF-local (no new objects linked).
rpc = []

[dependencies]
llama-cpp-2 = { version = "=0.1.133" }
llama-cpp-sys-2 = { version = "=0.1.133" }
# P9.2: second backend (safetensors dirs). Exact pin like the other engine
# crates; `default-features = false` keeps GPU accel opt-in (D13) — the
# high-level builder auto-maps devices. The blocking API owns its runtime,
# so runa-engine needs no tokio of its own.
mistralrs = { version = "=0.8.1", default-features = false, optional = true }
encoding_rs = "0.8"
thiserror = "1"
runa-core = { path = "../runa-core" }
runa-kernels = { path = "../runa-kernels" }
# P2.8 prompt cache: LMDB via heed (mmap KV, fastest local store).
heed = "0.22"
sha2 = "=0.11.0"
# P8.1: OpenAI-shape messages for llama.cpp's Jinja chat handler.
serde_json = "1.0.151"

[build-dependencies]
# P9.3: compiles the vendored ggml RPC backend (`rpc/`) behind `--features rpc`.
cc = "1"

# P10.2: `default_threads` reads the Apple P-core count via sysctl
# (`hw.perflevel0.logicalcpu`) on macOS only; other targets use
# `available_parallelism` and need no FFI.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
# P2.1 memory check: engine tensor bytes vs P1 descriptor estimate.
runa-core = { path = "../runa-core" }
runa-fit = { path = "../runa-fit" }
tempfile = "3"

# P0.5 `describe` needs the mtmd feature (see its docstring); without this
# section every `cargo test`/`cargo build --examples` on default features
# fails to compile the example.
[[example]]
name = "describe"
required-features = ["mtmd"]

# Vision integration tests need mtmd (same gate as `describe` example).
[[test]]
name = "vision_smolvlm"
required-features = ["mtmd"]
