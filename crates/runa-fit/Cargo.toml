[package]
name = "runa-fit"
description = "gguf header (local/remote), hw probe, estimator, planner, calibration db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = "1"
# P1.10 calibration DB persistence (derives serde traits).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
# P1.2 remote header fetch (plan D9: reqwest is also the future Anthropic
# adapter client). default-features off so no system TLS libs are needed on
# any CI target; rustls provides pure-Rust TLS. `blocking` keeps runa-fit
# runtime-agnostic (one-shot CLI fetch; bulk/async download lands in P2.4).
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
# P8.4 embedded `catalog.toml` for `runa fit --recommend`.
toml = "=1.1.8"

[dev-dependencies]
insta = "1.48.0"
proptest = "1"
rstest = "0.27.0"
