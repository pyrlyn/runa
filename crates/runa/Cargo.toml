[package]
name = "runa"
description = "Run AI models locally (GGUF via llama.cpp) or through the OpenAI and Anthropic APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/pyrlyn/runa"
homepage = "https://github.com/pyrlyn/runa"
rust-version.workspace = true

[features]
default = []
# P5.7 host-tuned build. Pair with RUSTFLAGS='-C target-cpu=native'.
native = ["runa-engine/native"]
metal = ["runa-engine/metal"]
cuda = ["runa-engine/cuda"]
vulkan = ["runa-engine/vulkan"]
# P9.4 NPU backends (Tier 3, probe-only stubs — see `runa-engine/Cargo.toml`
# and `docs/versions.md`): passthrough to the engine stubs. Default builds
# never enable these (plan D12); `runa doctor` reports `*-stub` only when
# built with the feature.
hexagon = ["runa-engine/hexagon"]
openvino = ["runa-engine/openvino"]
mtmd = ["runa-engine/mtmd"]
# P9.2: mistral.rs backend for safetensors dirs (`--backend mistral`).
mistralrs = ["runa-engine/mistralrs", "runa-pool/mistralrs"]
# P9.3: real ggml RPC backend (vendored b7709 `ggml-rpc.cpp` in runa-engine).
# Enables `--rpc` registration in `load()`; without it `--rpc` fails
# explicitly with `Unsupported`. Default builds stay GGUF-local.
rpc = ["runa-engine/rpc"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
chrono = "0.4"
anyhow = { workspace = true }
runa-core = { path = "../runa-core" }
runa-fit = { path = "../runa-fit" }
runa-memory = { path = "../runa-memory" }
# P2.3 run/chat CLI on the engine wrapper.
runa-engine = { path = "../runa-engine" }
# P16.2 engine wrapper + model pool, shared with embedders of local inference.
runa-pool = { path = "../runa-pool" }
# P3.8 secrets (env / keyring / reject inline keys).
runa-cloud = { path = "../runa-cloud" }
runa-media = { path = "../runa-media" }
# P2.3 REPL line editing + file history.
rustyline = "=18.0.1"
# P2.4 HF downloads (blocking API: sync CLI, runtime on bg thread).
hf-hub = { version = "=1.0.0", features = ["blocking"] }
# P2.4 SHA-256 verification of downloads.
sha2 = "=0.11.0"
# P2.4 minimal config ([models] aliases; full figment layering later).
toml = "=1.1.5"
axum = { version = "0.8", features = ["json", "http1", "tokio", "multipart", "ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
futures = "0.3.34"
# P8.3 MCP client (stdio servers) for the run/chat tool loop.
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
# P8.6 full-screen chat (`runa chat --tui`); versions match sibling cox-tui.
ratatui = "0.30.2"
crossterm = "0.29"
tui-textarea-2 = { version = "0.13", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
# Strict base64 for `data:` images and `input_audio` (reject padding junk).
base64 = "0.22.1"
# 0600 temp files deleted on drop for request payloads.
tempfile = "3"

[dev-dependencies]
# P2.3 e2e CLI tests.
assert_cmd = "=2.2.2"
insta = "1.48.0"
clap_mangen = "0.2"
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
predicates = "3.1.4"
pretty_assertions = "1.4.1"
assert_fs = "1.1.4"
trycmd = "1.2.1"

[lints.rust]
# `cargo fuzz` compiles src/main.rs with `--cfg fuzzing` (fuzz/Cargo.toml).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
