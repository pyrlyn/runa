bin.name = "runa"
args = ["serve", "--help"]
status = "success"
stdout = """
OpenAI-compatible HTTP server (P3.9 / P6.1)

Usage: runa[EXE] serve [OPTIONS] [MODEL]

Arguments:
  [MODEL]  Local model to load: `.gguf` file or mistral safetensors directory

Options:
      --models <MODELS>          Additional model paths (comma-separated or repeatable)
      --backend <BACKEND>        Local backend: gguf | mistral | auto (default: auto-detect per model) [default: auto]
      --parallel <PARALLEL>      Max in-flight HTTP generations (queued beyond this) [default: 1]
      --max-loaded <MAX_LOADED>  Max models kept loaded (LRU unloads the rest)
      --host <HOST>              Bind address (D11: 127.0.0.1 by default) [default: 127.0.0.1]
      --port <PORT>              Bind port. `0` picks an ephemeral port [default: 8080]
      --api-key <KEY>            Bearer token required on `/v1`. Required when `--host` is not a loopback address (`127.0.0.0/8` or `::1`)
      --mode <MODE>              Compute mode: cpu | gpu | hybrid | auto [default: cpu]
      --ctx <CTX>                Context length [default: 4096]
      --lora <PATH[:SCALE]>      LoRA adapter GGUF (`path[:scale]`). Repeatable; applies to every served model (P8.5)
      --device <LIST>            ggml backends to use (`0,1` or `CUDA0,CUDA1`, gguf models only)
      --tensor-split <LIST>      Per-GPU proportions (`3,1`, gguf models only)
      --main-gpu <N>             Main GPU for scratch/small tensors (gguf models only)
      --rpc <LIST>               llama.cpp RPC endpoints (`host:port,…`); registers only — select with `--device RPC0` (needs the `rpc` cargo feature, else an explicit error, P9.3)
      --threads <N>              Worker threads (default: P-cores on macOS, else all logical CPUs). GGUF backend only (P10.2)
      --max-load-percent <N>     Max share of total system resources (RAM budget + CPU thread share) the server may use, percent 1..=100 (default: 80)
  -h, --help                     Print help
"""
