# cargo-fuzz (libFuzzer) targets for runa. Not a member of the root
# workspace (see `exclude` there): normal builds, clippy and CI never
# compile this crate. Run with `cargo +nightly fuzz ...` (fuzz/README.md).
[package]
name = "runa-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Own workspace root so cargo does not attach this crate to the repo's.
[workspace]
members = ["."]

[features]
default = []
# The `cli-*`, `serve-body` and `daemon-proto` targets link the `runa`
# library (`--cfg fuzzing` comes from cargo-fuzz) and call
# `runa::fuzz_hooks::run`. That pulls llama.cpp and whisper.cpp.
# Heavy first build, so opt-in: `--features cli`.
cli = ["dep:runa"]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust library targets (default build: no llama.cpp).
runa-core = { path = "../crates/runa-core" }
runa-fit = { path = "../crates/runa-fit" }
runa-cloud = { path = "../crates/runa-cloud" }
runa = { path = "../crates/runa", optional = true }

[profile.release]
debug = 1

[[bin]]
name = "gguf-header"
path = "fuzz_targets/gguf_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reasoning-stream"
path = "fuzz_targets/reasoning_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cloud-responses"
path = "fuzz_targets/cloud_responses.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model-refs"
path = "fuzz_targets/model_refs.rs"
test = false
doc = false
bench = false

# The four bins below link the runa library and call fuzz_hooks::run.
# cargo-fuzz passes --cfg fuzzing, which is what compiles that module.
[[bin]]
name = "cli-argv"
path = "fuzz_targets/cli_argv.rs"
required-features = ["cli"]
test = false
doc = false
bench = false

[[bin]]
name = "cli-config"
path = "fuzz_targets/cli_config.rs"
required-features = ["cli"]
test = false
doc = false
bench = false

[[bin]]
name = "serve-body"
path = "fuzz_targets/serve_body.rs"
required-features = ["cli"]
test = false
doc = false
bench = false

[[bin]]
name = "daemon-proto"
path = "fuzz_targets/daemon_proto.rs"
required-features = ["cli"]
test = false
doc = false
bench = false
