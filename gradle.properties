# The single source of the runa version; :app bakes it into BuildInfo.kt.
version=0.1.0-dev

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
# A Linux host cannot build macosArm64; skip it there instead of failing the whole build.
kotlin.native.ignoreDisabledTargets=true

# :engine-llama calls llama.cpp from nativeMain, the source set shared by every target.
kotlin.mpp.enableCInteropCommonization=true

# Windows is optional for 1.0 (PLAN.md, section 13). Set to true to add the mingwX64 target.
runa.mingw=false
