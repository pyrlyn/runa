# Tool pins for mise users (https://mise.jdx.dev/). Task P0.3, plan D16.
# rust-toolchain.toml remains the source of truth for the exact rustc patch
# version; this file exists so `mise install` bootstraps a matching toolchain
# for contributors who manage tools with mise. Keep the two files in sync.
[tools]
mold = { version = "2.42.1", os = ["linux"] } # linker, Linux only; mise [env] below turns it on where it is installed
# rust-toolchain.toml stays the rustup source of truth for direct rustup runs;
# mise only reads its components when the pin itself comes from that file, so
# the components are mirrored here (CI runs under RUSTUP_TOOLCHAIN, which
# overrides rust-toolchain.toml; without this, cargo fmt/clippy are missing).
rust = { version = "1.98", components = "rustfmt,clippy" }
# moon monorepo runner (plan D22, task K1). Pin ↔ `.moon/workspace.yml`
# versionConstraint ↔ `docs/versions.md`. Installed via the aqua backend
# (no core mise plugin for moon as of 2026-09-08).
"aqua:moonrepo/moon" = "2.5.4"
# video pipeline (P4.5) — ffmpeg-sidecar binary, not linked
ffmpeg = "9.0.1"
# fixtures & SDK smoke tests (P0.7, P3.9, P6.2)
# 3.11.9 lacks GitHub artifact attestations (fatal on mise >= 2026.9.6,
# CI run 34778192909); 3.13.x verifies clean.
python = "3.13.15"
node = "24.21.0"
# packaging (P6.3) — prebuilt binary via aqua (same 0.33.0 release.yml was
# generated with). The `cargo:` backend compiled from source and raced
# rustup component downloads against the second `cargo:` install
# (CI run 34778192909: rename/.partial conflicts, premature eof).
"aqua:axodotdev/cargo-dist" = "0.33.0"
# developer utility (not a crate dep): report/autoclean $CARGO_HOME
# Left as the only `cargo:`-backend tool so concurrent `cargo install`
# processes can no longer race the same rustup downloads directory.
"cargo:cargo-cache" = "0.8.3"
# own kernels (D23) — Zig where better than new C
zig = "0.16.0"
# changelog for releases (P13.3): CHANGELOG.md is generated from git history,
# config in cliff.toml. Same pin style as the rest of this file (D16).
git-cliff = "2.13.1"

[env]
# mold as the Linux linker only where mise has installed it (clang is the driver): without mold
# the variable is empty and the default linker stays, so a Linux machine without mold or clang
# still builds. Not in .cargo/config.toml: a missing mold there would break every Linux build.
# Cargo takes these only when RUSTFLAGS is unset. macOS keeps Apple ld; Windows uses rust-lld
# through .cargo/config.toml. The probe variable stops `mise which` from recursing.
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{% if os() == 'linux' and get_env(name='MISE_MOLD_PROBE', default='') == '' %}{{ exec(command='MISE_MOLD_PROBE=1 \"' ~ mise_bin ~ '\" which mold >/dev/null 2>&1 && echo \"-C linker=clang -C link-arg=-fuse-ld=mold\" || true') }}{% endif %}"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{% if os() == 'linux' and get_env(name='MISE_MOLD_PROBE', default='') == '' %}{{ exec(command='MISE_MOLD_PROBE=1 \"' ~ mise_bin ~ '\" which mold >/dev/null 2>&1 && echo \"-C linker=clang -C link-arg=-fuse-ld=mold\" || true') }}{% endif %}"
