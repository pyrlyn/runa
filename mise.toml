# Tool pins for mise users (https://mise.jdx.dev/). The Kotlin/Native toolchain itself comes from
# the Gradle wrapper and the Kotlin Gradle plugin (see PLAN.md, phase 0); mise only provides the
# JDK that runs Gradle and the repository lint tools.
[tools]
java = "temurin-21" # runs Gradle and the Kotlin/Native compiler
cmake = "4" # builds the vendored llama.cpp static libraries for cinterop (PLAN.md, phase 4)
# Workflow lint (hk.pkl); CI lints through pyrlyn/ci (pipeline.yml).
"github:jdx/jactionlint" = "2.1.0" # the pre-push hook and local `mise x -- jactionlint`
hk = "2.12.0" # runs jactionlint as a pre-push hook (hk.pkl); `mise x -- hk install --mise`
shellcheck = "0.11.0" # used by jactionlint for run: scripts; CI uses the runner image's copy
