# Workspace-root project (plan K1). `id` avoids colliding with the
# `crates/runa` project (both would otherwise derive the id `runa`).
# The rust toolchain is disabled here so no per-crate tasks are inherited;
# run those across all crates with `moon run :build` / `:test` / `:clippy`.
id: 'root'
language: 'bash'
layer: 'configuration'

toolchains:
  rust: false

tasks:
  lint-tasks:
    description: 'lint the task-claim registry (AGENTS.md §6, P7.6)'
    command: 'python3 scripts/lint-tasks.py docs/tasks.md'
    inputs:
      - 'docs/tasks.md'
      - 'scripts/lint-tasks.py'
  cache:
    description: 'report $CARGO_HOME sizes (no deletes); cargo-cache via mise'
    command: 'cargo-cache'
    options:
      cache: false
  cache-dry-run:
    description: 'preview cargo-cache --autoclean (source + git checkouts)'
    command: 'cargo-cache --autoclean --dry-run'
    options:
      cache: false
  cache-autoclean:
    description: 'remove cargo source and git checkouts; indexes stay'
    command: 'cargo-cache --autoclean'
    options:
      cache: false
  fixtures-check:
    description: 'fail when any file in tests/fixtures exceeds 3 GiB'
    command: 'python3 scripts/check-fixture-size.py'
    inputs:
      - 'tests/fixtures'
      - 'scripts/check-fixture-size.py'
  fixtures-clean:
    description: 'remove downloaded weights, keep hand-made fixtures'
    command: 'python3 scripts/clean-fixtures.py'
    options:
      cache: false
  test-fast:
    description: 'library tests plus weight-free integration tests (no GGUF download, no engine e2e)'
    command: 'bash scripts/test-fast.sh'
    options:
      cache: false
  test-with-cleanup:
    description: 'full workspace cargo test, then remove downloaded weights on a green pass'
    command: 'bash scripts/test-with-fixture-cleanup.sh --workspace'
    options:
      cache: false
