# Pinned Rust toolchain (plan D16, task P0.3).
# Source of truth for rustup: any cargo/rustc run inside this repo uses this
# toolchain unless RUSTUP_TOOLCHAIN is set in the environment.
# Mirrors the rust pin in mise.toml (1.99.1); keep both in sync. See docs/versions.md.
# NOTE: moon's rust plugin must NOT sync this file (syncToolchainConfig off
# in .moon/toolchains.yml) — it rewrites the channel as "~1.99" (invalid
# for rustup) and strips these comments.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
