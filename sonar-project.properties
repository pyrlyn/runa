# sonar.organization and sonar.projectKey are placeholders: adjust them to match the
# SonarCloud UI after the repository is imported. See the setup guide for details.
sonar.organization=listepo
sonar.projectKey=listepo_runa
sonar.projectName=runa
sonar.sourceEncoding=UTF-8
sonar.sources=crates
sonar.tests=crates,tests
sonar.test.inclusions=crates/*/tests/**,tests/**
sonar.exclusions=**/target/**,crates/*/tests/**,**/benches/**,crates/runa-engine/rpc/ggml/**,**/fixtures/**,**/*.gguf,**/*.wav
sonar.test.exclusions=tests/fixtures/**
sonar.rust.lcov.reportPaths=coverage/lcov.info
# C/C++/Objective-C analysis needs a compilation database; it is off for now (see the guide).
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
