# Read by pyrlyn/ci's SonarCloud job (.github/infra.yml). Sources are every module's
# src/*Main, tests every src/*Test; Gradle output and build-logic's generated code are excluded.
sonar.organization=listepo
sonar.projectKey=listepo_runa
sonar.projectName=runa
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.inclusions=*/src/*Main/**/*.kt,build-logic/src/main/**/*.kts
sonar.tests=.
sonar.test.inclusions=*/src/*Test/**/*.kt
sonar.exclusions=**/build/**,**/.gradle/**,**/.kotlin/**
